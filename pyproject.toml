[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-toolkit"
description = "Web interface for the pdf-toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    "flask",
]

[project.scripts]
pdf-toolkit-web = "pdf_toolkit.web.app:main"

[tool.setuptools]
packages = ["pdf_toolkit", "pdf_toolkit.web"]

[tool.setuptools.dynamic]
version = { attr = "pdf_toolkit.__version__" }
